<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — The Inkwell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .flash-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    .flash-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="flex items-baseline justify-center gap-1 mb-2">
        <span style="font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; color:white;">The</span>
        <span style="font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; color:#c8472a; font-style:italic;">Inkwell</span>
      </div>
      <p style="font-family:monospace; font-size:0.75rem; color:#6b7280; letter-spacing:0.1em; text-transform:uppercase;">Admin Access</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="flash-{{ cat }} px-4 py-3 rounded mb-4 text-sm">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login form -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-8">
      <h1 class="text-white font-semibold text-lg mb-6">Sign in</h1>
      <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1.5" style="font-family:monospace; text-transform:uppercase; letter-spacing:0.05em;">Username</label>
          <input type="text" name="username" required autofocus
            class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:border-red-500 placeholder-gray-600"
            placeholder="Enter username">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5" style="font-family:monospace; text-transform:uppercase; letter-spacing:0.05em;">Password</label>
          <input type="password" name="password" required
            class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:border-red-500 placeholder-gray-600"
            placeholder="Enter password">
        </div>
        <button type="submit"
          class="w-full py-2.5 rounded-lg text-sm font-semibold text-white mt-2"
          style="background-color:#c8472a;">
          Sign In →
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-xs text-gray-600">
      <a href="{{ url_for('index') }}" class="hover:text-gray-400">← Back to site</a>
    </p>
  </div>
</body>
</html>
